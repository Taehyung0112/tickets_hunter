name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Deliberately not requirement.txt: util.py and settings.py need only
      # stdlib + requests + tornado. Pulling ddddocr/onnxruntime/zendriver in
      # would pin CI to Python 3.10-3.11 and add minutes for no coverage.
      - name: Install
        run: python -m pip install --quiet pytest ruff requests tornado

      # Blocking: the paths this fork owns.
      - name: Lint owned paths
        run: ruff check src/settings.py src/util.py src/nodriver_tixcraft.py tests/

      - name: Test
        run: pytest

      # Non-blocking: src/platforms/ and nodriver_common.py are taken verbatim
      # from upstream and never edited here, so their findings are reported for
      # awareness after a sync, not enforced.
      - name: Lint upstream-owned paths (report only)
        continue-on-error: true
        run: ruff check src/platforms/ src/nodriver_common.py
